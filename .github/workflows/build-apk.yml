name: AI App Doctor Expo APK Builder

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Direct download URL of the Expo project ZIP"
        required: false
        type: string

      callback_url:
        description: "Optional backend webhook URL"
        required: false
        type: string

  push:
    paths:
      - "input/**"
      - ".github/workflows/build-apk.yml"
      - "scripts/**"

concurrency:
  group: ai-app-doctor-expo-apk-builder
  cancel-in-progress: false

jobs:
  build:
    name: Examine, diagnose, repair, build and validate Expo APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ============================================================
      # 3. NODE
      #
      # IMPORTANT:
      # Do NOT use cache: npm here.
      #
      # setup-node's npm cache requires a lockfile to already exist
      # in the repository.
      #
      # Our Expo ZIP is downloaded AFTER this step, so the lockfile
      # may not exist yet.
      # ============================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ============================================================
      # 4. PYTHON REQUIREMENTS
      # ============================================================
      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 5. DOWNLOAD EXPO PROJECT ZIP
      #
      # You can provide:
      #
      # zip_url
      #
      # OR
      #
      # place exactly one ZIP inside:
      #
      # input/
      # ============================================================
      - name: Download Expo project ZIP
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}

        run: |
          set -e

          echo "=========================================="
          echo "EXPO PROJECT INPUT"
          echo "=========================================="

          rm -rf output
          mkdir -p output
          mkdir -p input

          if [ -n "$ZIP_URL" ]; then

            echo "Downloading Expo project from supplied URL..."

            rm -f input/*.zip

            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 600 \
              "$ZIP_URL" \
              -o input/project.zip

          else

            echo "No ZIP URL supplied."
            echo "Checking input/ for an Expo project ZIP..."

            shopt -s nullglob

            files=(input/*.zip)

            if [ "${#files[@]}" -ne 1 ]; then
              echo "::error::Provide zip_url or put exactly one ZIP in input/."
              echo ""
              echo "Expected:"
              echo "input/project.zip"
              exit 1
            fi

            cp "${files[0]}" input/project.zip

          fi

          echo ""
          echo "Checking ZIP..."

          test -s input/project.zip || {
            echo "::error::ZIP is empty."
            exit 1
          }

          unzip -t input/project.zip >/dev/null || {
            echo "::error::ZIP is corrupted or invalid."
            exit 1
          }

          echo ""
          echo "Expo ZIP verified successfully."

          echo ""
          echo "ZIP information:"
          ls -lh input/project.zip

      # ============================================================
      # 6. EXPO PROJECT INSPECTION
      # ============================================================
      - name: Inspect Expo project
        run: |
          set -e

          echo "=========================================="
          echo "EXPO PROJECT INSPECTION"
          echo "=========================================="

          rm -rf /tmp/expo-inspection
          mkdir -p /tmp/expo-inspection

          unzip -q input/project.zip -d /tmp/expo-inspection

          echo ""
          echo "Project files:"
          find /tmp/expo-inspection \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -300

          echo ""
          echo "Searching for package.json..."

          find /tmp/expo-inspection \
            -name package.json \
            -not -path "*/node_modules/*" \
            -print

          echo ""
          echo "Searching for Expo configuration..."

          find /tmp/expo-inspection \
            \( \
              -name app.json \
              -o -name app.config.js \
              -o -name app.config.ts \
            \) \
            -not -path "*/node_modules/*" \
            -print

      # ============================================================
      # 7. AI APP DOCTOR
      #
      # The Python engine handles:
      #
      # - Expo detection
      # - package manager detection
      # - lockfile detection
      # - dependency installation
      # - Expo configuration diagnosis
      # - Expo prebuild
      # - native Android generation BY EXPO
      # - Gradle build
      # - failure diagnosis
      # - human explanation
      # - technical diagnosis
      # - safe repair
      # - rebuild
      # - APK validation
      # ============================================================
      - name: Run AI App Doctor Expo pipeline
        id: doctor
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
        run: |
          set +e

          echo "=========================================="
          echo "AI APP DOCTOR"
          echo "=========================================="

          python scripts/app_doctor_pipeline.py

          EXIT_CODE=$?

          echo ""
          echo "=========================================="
          echo "AI APP DOCTOR EXIT CODE: $EXIT_CODE"
          echo "=========================================="

          exit $EXIT_CODE

      # ============================================================
      # 8. SHOW OUTPUT
      # ============================================================
      - name: Show build output
        if: always()
        run: |
          echo "=========================================="
          echo "AI APP DOCTOR OUTPUT"
          echo "=========================================="

          echo ""
          echo "APK files:"
          find output \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

          echo ""
          echo "PDF reports:"
          find output \
            -type f \
            -name "*.pdf" \
            -print 2>/dev/null || true

          echo ""
          echo "Diagnostic files:"
          find output \
            -type f \
            \( \
              -name "*diagnostic*" \
              -o -name "*diagnosis*" \
              -o -name "*report*" \
              -o -name "*.log" \
            \) \
            -print 2>/dev/null || true

      # ============================================================
      # 9. UPLOAD APK + REPORT
      # ============================================================
      - name: Upload validated APK + PDF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-app-doctor-expo-validated-output
          path: |
            output/*.apk
            output/*.pdf
            output/**/*diagnostic*
            output/**/*diagnosis*
            output/**/*.log

          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 10. BACKEND CALLBACK
      # ============================================================
      - name: Notify backend
        if: always()
        env:
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
          RUN_ID: ${{ github.run_id }}

        run: |
          set +e

          if [ -n "$CALLBACK_URL" ]; then

            echo "Sending build status to backend..."

            STATUS="failed"

            if compgen -G "output/*-debug-validated.apk" > /dev/null; then
              STATUS="success"
            fi

            python - <<'PY'
          import json
          import os
          import urllib.request

          url = os.environ.get("CALLBACK_URL", "")
          run_id = os.environ.get("RUN_ID", "")
          status = os.environ.get("STATUS", "failed")

          if not url:
              raise SystemExit(0)

          payload = json.dumps({
              "run_id": run_id,
              "status": status
          }).encode()

          request = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print("Backend response:", response.status)
          except Exception as exc:
              print("Backend notification failed:", exc)
          PY

          else

            echo "No callback URL supplied."

          fi
