name: AI App Doctor Expo APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Examine, Diagnose, Repair, Build and Validate Expo APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. SETUP PYTHON
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ============================================================
      # 3. SETUP NODE
      #
      # IMPORTANT:
      # Do NOT use "cache: npm" here.
      #
      # The Expo ZIP is inspected/downloaded later and may legitimately
      # have no package-lock.json/yarn.lock/pnpm-lock.yaml.
      #
      # setup-node cache requires a lockfile BEFORE the project exists
      # in the runner, which caused the previous failure.
      # ============================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ============================================================
      # 4. VERIFY ENVIRONMENT
      # ============================================================
      - name: Show environment
        run: |
          echo "=========================================="
          echo "AI APP DOCTOR - EXPO BUILDER"
          echo "=========================================="
          echo ""
          echo "Node:"
          node --version
          echo ""
          echo "NPM:"
          npm --version
          echo ""
          echo "Python:"
          python --version
          echo ""
          echo "Working directory:"
          pwd
          echo ""
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort | head -300

      # ============================================================
      # 5. RUN AI APP DOCTOR
      # ============================================================
      #
      # The Python engine is responsible for:
      #
      # - locating the Expo project
      # - detecting package manager
      # - detecting Expo SDK
      # - checking Expo configuration
      # - checking dependencies
      # - installing dependencies
      # - running Expo prebuild
      # - generating Android project through Expo
      # - running Gradle
      # - diagnosing failures
      # - applying safe repairs
      # - rebuilding
      # - validating APK
      #
      # ============================================================
      - name: Examine, diagnose, repair, build and validate Expo APK
        run: |
          set +e

          echo "=========================================="
          echo "STARTING AI APP DOCTOR"
          echo "=========================================="

          python scripts/app_doctor_pipeline.py

          EXIT_CODE=$?

          echo ""
          echo "=========================================="
          echo "AI APP DOCTOR EXIT CODE: $EXIT_CODE"
          echo "=========================================="

          exit $EXIT_CODE

      # ============================================================
      # 6. LIST GENERATED FILES
      # ============================================================
      - name: Show build artifacts
        if: always()
        run: |
          echo "=========================================="
          echo "BUILD OUTPUT"
          echo "=========================================="

          echo ""
          echo "APK files:"
          find . -type f \( \
            -name "*.apk" \
            -o -name "*.aab" \
          \) -print 2>/dev/null || true

          echo ""
          echo "Reports:"
          find . -type f \( \
            -name "*.pdf" \
            -o -name "*report*" \
            -o -name "*diagnostic*" \
            -o -name "*diagnosis*" \
            -o -name "*.log" \
          \) -print 2>/dev/null || true

      # ============================================================
      # 7. UPLOAD APK + DIAGNOSTICS
      # ============================================================
      - name: Upload APK and diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-apk-doctor-results
          path: |
            **/*.apk
            **/*.aab
            **/*.pdf
            **/*diagnostic*
            **/*diagnosis*
            **/*report*
            **/*.log
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # 8. FINAL STATUS
      # ============================================================
      - name: Final build status
        if: always()
        run: |
          echo "=========================================="
          echo "FINAL AI APP DOCTOR STATUS"
          echo "=========================================="

          APK_COUNT=$(find . -type f -name "*.apk" 2>/dev/null | wc -l)

          if [ "$APK_COUNT" -gt 0 ]; then
            echo "APK artifact detected."
            echo "The APK must still pass the Doctor's validation checks."
          else
            echo "No APK artifact detected."
            echo "Check the uploaded diagnostic artifacts and logs."
          fi
